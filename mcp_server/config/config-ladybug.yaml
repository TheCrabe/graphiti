# Graphiti MCP Server Configuration - LadybugDB + Ollama (fully local, zero cost)
#
# LadybugDB: embedded graph database (no Docker, no external services)
# Ollama: local LLM + embeddings (no API keys needed)
#
# Prerequisites:
#   sudo pacman -S ollama
#   ollama pull nomic-embed-text
#   ollama pull mistral
#   systemctl --user start ollama
#
# Usage:
#   uv run main.py --config config/config-ladybug.yaml --transport stdio

server:
  transport: "stdio"

llm:
  provider: "openai"  # Ollama exposes an OpenAI-compatible API
  model: "mistral"
  max_tokens: 4096

  providers:
    openai:
      api_key: "ollama"
      api_url: "http://localhost:11434/v1"

embedder:
  provider: "openai"  # Ollama exposes an OpenAI-compatible API
  model: "nomic-embed-text"
  dimensions: 768

  providers:
    openai:
      api_key: "ollama"
      api_url: "http://localhost:11434/v1"

database:
  provider: "ladybug"

  providers:
    ladybug:
      db_path: ${LADYBUG_DB_PATH:/home/lecrabe/.local/share/graphiti/memory.db}
      max_concurrent_queries: 1

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:main}
  user_id: ${USER_ID:lecrabe}
  entity_types:
    - name: "Preference"
      description: "User preferences, choices, opinions, or selections"
    - name: "Requirement"
      description: "Specific needs, features, or functionality that must be fulfilled"
    - name: "Procedure"
      description: "Standard operating procedures and sequential instructions"
    - name: "Project"
      description: "Software projects, repositories, or codebases being worked on"
    - name: "Decision"
      description: "Technical or architectural decisions made during development"
    - name: "Person"
      description: "People, team members, collaborators"
    - name: "Tool"
      description: "Software tools, frameworks, libraries, or services used"
